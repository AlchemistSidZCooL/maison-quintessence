<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0A0A0A;color:#F4F0EB;font-family:Outfit,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(212,175,55,.09),transparent 45%)}
.frame{position:absolute;inset:28px;border:1px solid rgba(212,175,55,.2)}
img{width:170px;height:170px;position:relative}
h1{font-weight:200;letter-spacing:.3em;font-size:52px;margin-top:34px;text-transform:uppercase;position:relative;padding-left:.3em}
.rule{width:220px;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.7),transparent);margin:26px 0}
p{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.28em;color:#D4AF37;text-transform:uppercase;position:relative}
</style></head><body><div class="frame"></div>
<img src="../logo/A_inscrito.svg" alt=""><h1>Maison Quintessence</h1><div class="rule"></div>
<p>Estudio de diseño e ingeniería web · Madrid</p></body></html>
